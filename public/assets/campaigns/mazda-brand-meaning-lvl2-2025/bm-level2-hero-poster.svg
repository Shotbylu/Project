<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
  <defs>
    <linearGradient id="brand-hero" x1="0" y1="0" x2="1080" y2="1920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.55" stop-color="#111827" />
      <stop offset="1" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="brand-hero-glow" x1="200" y1="240" x2="880" y2="1680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.7" />
      <stop offset="0.5" stop-color="#facc15" stop-opacity="0.25" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.15" />
    </linearGradient>
    <filter id="grain" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#brand-hero)" />
  <rect x="90" y="140" width="900" height="1640" rx="96" fill="url(#brand-hero-glow)" opacity="0.6" />
  <rect width="1080" height="1920" fill="url(#brand-hero)" opacity="0.35" />
  <rect width="1080" height="1920" fill="black" opacity="0.2" />
  <rect width="1080" height="1920" fill="url(#brand-hero)" opacity="0.35" />
  <rect width="1080" height="1920" fill="url(#brand-hero)" opacity="0.25" />
  <rect width="1080" height="1920" fill="url(#brand-hero)" opacity="0.25" filter="url(#grain)" />
  <g fill="white" font-family="'Inter', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="540" y="420" font-size="56" font-weight="600" fill="#f8fafc" letter-spacing="0.6em" opacity="0.75">MAZDA</text>
    <text x="540" y="520" font-size="140" font-weight="700" fill="#f97316">BRAND</text>
    <text x="540" y="640" font-size="120" font-weight="700" fill="#f97316">MEANING</text>
    <text x="540" y="780" font-size="48" font-weight="500" fill="#f8fafc" letter-spacing="0.35em">LEVEL 2</text>
    <text x="540" y="920" font-size="40" font-weight="500" fill="#cbd5f5" opacity="0.85">Hero narrative · Craft · Joy</text>
  </g>
  <g fill="#cbd5f5" font-family="'Inter', 'Segoe UI', sans-serif" opacity="0.85">
    <text x="150" y="1080" font-size="34" font-weight="500">Video-first storytelling</text>
    <text x="150" y="1140" font-size="22" font-weight="400">Cinematic edits designed for 9:16 placements.</text>
    <text x="150" y="1200" font-size="22" font-weight="400">Optimised for engagement + lead conversion.</text>
  </g>
  <g transform="translate(150 1320)" fill="#f8fafc" font-family="'Inter', 'Segoe UI', sans-serif">
    <rect width="300" height="64" rx="32" fill="#f97316" opacity="0.85" />
    <text x="150" y="42" font-size="26" font-weight="600">Play Preview</text>
  </g>
</svg>
